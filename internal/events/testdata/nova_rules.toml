[[event]]
source = "vision"
type = "description"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = true
inject_template = "Right now you see: {description}"

# --- Gaze-lock lifecycle (t13) ---

[[event]]
source = "motion"
type = "face-lost"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
voice = "brief"
sense = "face"
inject_template = "(the person you were watching is out of view)"

[[event]]
