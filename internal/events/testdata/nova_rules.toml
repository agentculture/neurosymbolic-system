[[event]]
source = "memory"
type = "context"
priority = "NORMAL"
urgency = "DEFERRABLE"
llm_evaluate = false
inject_template = "Something you know: {text}"

[[event]]
source = "memory"
type = "result"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You remember: {text}"

# --- Emotion events ---

[[event]]
source = "emotions"
type = "wound_created"
priority = "HIGH"
urgency = "NOW"
llm_evaluate = false
inject_template = "That really hurt."

[[event]]
source = "emotions"
type = "wound_healed"
priority = "NORMAL"
urgency = "DEFERRABLE"
llm_evaluate = false

[[event]]
