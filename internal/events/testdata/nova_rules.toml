[[event]]
source = "pat"
type = "level1"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
voice = "brief"
sense = "pat"
inject_template = "(someone is patting you gently)"

[[event]]
source = "pat"
type = "level2"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
voice = "brief"
sense = "pat"
inject_template = "(someone is patting you more firmly)"

[[event]]
source = "pat"
type = "detected"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
voice = "brief"
sense = "pat"
inject_template = "(someone is touching you)"

[[event]]
source = "face"
type = "recognized"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You notice {name} is here."

[[event]]
source = "face"
type = "unknown"
priority = "LOW"
urgency = "DEFERRABLE"
llm_evaluate = false
