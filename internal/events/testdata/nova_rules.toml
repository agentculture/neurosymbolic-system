# TRANSCRIPTION (t6), not the source of truth. Hand-transcribed from
# reachy_nova's config/nervous-system/rules.yaml
# (../../../../reachy_nova/config/nervous-system/rules.yaml as read from this
# worktree) into this repo's [[event]]/[event_default] TOML dialect
# (internal/rules), by neurosymbolic-system's t6 agent, 2026-09-05.
#
# Field mapping, verbatim from the donor's own header comments:
#   default:            -> [event_default]
#   rules.<source/type>: -> one [[event]] table with source/type split on "/"
#   priority/urgency/llm_evaluate/inject_template/voice/sense/dedupe ->
#     identically named fields (see internal/rules/model.go's doc comment)
#
# INFORMATION LOST IN THIS TRANSCRIPTION:
#
#   The three per-rule OVERRIDE keys the donor keys as "<source>/<type>:<rule
#   id>" — "rule/fire:pat-acknowledge", "rule/fire:nova-face-noticed" and
#   "rule/fire:nova-pat-cheer" — are OMITTED here, not merely disabled. This
#   schema's event identity is exactly "source/type" (t6's design, see
#   internal/rules/model.go's Event.ID) with no third "/<rule>" component, so
#   the donor's payload-conditional override — reachy_nova/harness/bus.py's
#   rule_for() picks the "<source>/<type>:<rule>" entry over the generic
#   "<source>/<type>" one when payload["rule"] names it — cannot be
#   represented: an internal/events.Router resolves purely on
#   Event.Source/Event.Type, never on payload contents. The generic
#   "rule/fire" entry below (voice = "silent") is transcribed in full; the
#   three overrides' more specific inject_template/voice/sense/dedupe text
#   is lost with them. A future task that wants that behavior back needs a
#   genuine schema extension (a third routing key component), not a config
#   change here.
schema_version = 1

[event_default]
priority = "NORMAL"
urgency = "DEFERRABLE"
llm_evaluate = true
voice = "free"

# --- Tracking events ---

[[event]]
source = "tracking"
type = "snap_detected"
priority = "HIGH"
urgency = "IMMEDIATE"
llm_evaluate = false
inject_template = "You heard a sharp snap nearby."

[[event]]
source = "tracking"
type = "person_detected"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = true
inject_template = "Someone just came into view."

[[event]]
source = "tracking"
type = "person_lost"
priority = "LOW"
urgency = "DEFERRABLE"
llm_evaluate = false
inject_template = "The person you were looking at walked away."

[[event]]
source = "tracking"
type = "mode_changed"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "tracking"
type = "face_recognized"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You notice {name} is here."

[[event]]
source = "tracking"
type = "pat_level1"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "tracking"
type = "pat_level2"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "tracking"
type = "audio_direction"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

# --- Speech events ---

[[event]]
source = "speech"
type = "speech_detected"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You just heard: {transcript}"

# --- Face events ---

[[event]]
source = "face"
type = "face_recognized"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You notice {name} is here."

# --- Vision events ---

[[event]]
source = "vision"
type = "vision_description"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = true
inject_template = "Right now you see: {description}"

[[event]]
source = "vision"
type = "analysis_started"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

# --- Slack events ---

[[event]]
source = "slack"
type = "slack_mention"
priority = "HIGH"
urgency = "IMMEDIATE"
llm_evaluate = false
inject_template = "{user} just mentioned you on Slack: {text}"

[[event]]
source = "slack"
type = "slack_message"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = true
inject_template = "New Slack message from {user}: {text}"

[[event]]
source = "slack"
type = "slack_dm"
priority = "HIGH"
urgency = "IMMEDIATE"
llm_evaluate = false
inject_template = "{user} sent you a direct message on Slack: {text}"

[[event]]
source = "slack"
type = "slack_reaction"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

# --- Browser events ---

[[event]]
source = "browser"
type = "task_completed"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You found this: {result}"

[[event]]
source = "browser"
type = "progress"
priority = "LOW"
urgency = "DEFERRABLE"
llm_evaluate = false
inject_template = "Still looking... {message}"

[[event]]
source = "browser"
type = "task_started"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

# --- Memory events ---

[[event]]
source = "memory"
type = "query_result"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "You remember: {result}"

[[event]]
source = "memory"
type = "store_result"
priority = "LOW"
