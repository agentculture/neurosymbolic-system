[[event]]
source = "forge"
type = "rejected"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
inject_template = "A new skill idea didn't pass its safety check: {reason}"

# --- Runtime bus events (reachy-mini-cli's symbolic runtime) ---

[[event]]
source = "sense"
type = "snapshot"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "rule"
type = "fire"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
voice = "silent"
inject_template = "(body cue: {rule})"

# NOTE: the donor's "rule/fire:pat-acknowledge", "rule/fire:nova-face-noticed"
# and "rule/fire:nova-pat-cheer" per-rule overrides are OMITTED here — see the
# file header's "INFORMATION LOST" note.

[[event]]
source = "rule"
type = "suppress"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "intent"
type = "declare"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "intent"
type = "update"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "intent"
type = "clear"
priority = "LOW"
urgency = "BACKGROUND"
llm_evaluate = false

[[event]]
source = "intent"
type = "applied"
priority = "NORMAL"
urgency = "DEFERRABLE"
llm_evaluate = false
voice = "none"
inject_template = "Your standing intention '{name}' is now in effect."

[[event]]
source = "intent"
type = "blocked"
priority = "NORMAL"
urgency = "NOW"
llm_evaluate = false
voice = "none"
dedupe = "reflex-held"
inject_template = "(a body reflex was held back)"

[[event]]
source = "motion"
type = "admit"
priority = "LOW"
urgency = "BACKGROUND"
